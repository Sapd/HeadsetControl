name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            shell: bash
          - name: macOS
            os: macos-latest
            shell: bash
          - name: Windows (MinGW)
            os: windows-latest
            shell: msys2 {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Windows: Setup MSYS2
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          # UCRT64, not MINGW64: MSYS2 is retiring the msvcrt-based
          # environments package by package. On 2026-10-16 hidapi lost mingw64
          # (MINGW-packages 5d003630a), so mingw-w64-x86_64-hidapi no longer
          # exists and MINGW64 cannot be set up at all. gcc/cmake/ninja still
          # have mingw64 builds today, but they are on the same path.
          msystem: UCRT64
          update: true
          # git is needed for the version detection in CMakeLists.txt; it is not
          # part of base-devel and the MSYS2 shell does not inherit Git for
          # Windows from the runner PATH.
          install: base-devel git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-hidapi

      # Linux/macOS: Setup CMake and Ninja
      - name: Setup CMake and Ninja
        if: runner.os != 'Windows'
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # v4.5.1

      # Linux: pin GCC 13, the oldest version CMakeLists.txt accepts, so CI
      # keeps testing the documented minimum rather than whatever the runner
      # image happens to default to. It comes from the Ubuntu archive; the
      # ubuntu-toolchain-r/test PPA carries no gcc-13 for any series.
      - name: Install GCC 13 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 libhidapi-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # macOS: Install dependencies
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hidapi

      # Linux/macOS: Build with CMake Presets
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: 'default'
          buildPreset: 'default'
          testPreset: 'default'

      # The README device table is generated; a device change must come with its new output
      - name: Check the README device table
        if: runner.os == 'Linux'
        run: .github/scripts/check-readme-table.sh build/headsetcontrol README.md

      # Windows: Build with MSYS2
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: |
          # Precaution: actions/checkout records safe.directory in the runner
          # user's global gitconfig, which the MSYS2 shell may not read because
          # it uses a different HOME.
          git config --global --add safe.directory "$(pwd)"
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja
          ctest --output-on-failure

      # Upload Windows artifact for testing
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headsetcontrol-windows-mingw
          path: build/headsetcontrol.exe
          retention-days: 30
