name: Build

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            shell: bash
          - name: macOS
            os: macos-latest
            shell: bash
          - name: Windows (MinGW)
            os: windows-latest
            shell: msys2 {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Windows: Setup MSYS2
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          # git is needed for the version detection in CMakeLists.txt; it is not
          # part of base-devel and the MSYS2 shell does not inherit Git for
          # Windows from the runner PATH.
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-hidapi

      # Linux/macOS: Setup CMake and Ninja
      - name: Setup CMake and Ninja
        if: runner.os != 'Windows'
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

      # Linux: Install GCC 13 for C++20 support
      - name: Install GCC 13 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 libhidapi-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # macOS: Install dependencies
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hidapi

      # Linux/macOS: Build with CMake Presets
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: 'default'
          buildPreset: 'default'
          testPreset: 'default'

      # Windows: Build with MSYS2
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: |
          # Precaution: actions/checkout records safe.directory in the runner
          # user's global gitconfig, which the MSYS2 shell may not read because
          # it uses a different HOME.
          git config --global --add safe.directory "$(pwd)"
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja
          ctest --output-on-failure

      # Upload Windows artifact for testing
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headsetcontrol-windows-mingw
          path: build/headsetcontrol.exe
          retention-days: 30
