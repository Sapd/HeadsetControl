name: Upload to PPA

# On a semver tag, build the Debian source package and upload it to the
# Launchpad PPA (ppa:sapd/headsetcontrol). Launchpad then builds the .deb.
#
# Reuses the release signing subkey stored in secrets:
#   GPG_PRIVATE_KEY - armored export of the signing subkey
#   GPG_PASSPHRASE  - its passphrase
#
# Only Ubuntu series with GCC 13+ are targeted (the project needs C++20);
# noble (24.04 LTS) qualifies, jammy (GCC 11) does not.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + upload (e.g. 4.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ppa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        series: [noble]
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DEBEMAIL: git@sapd.eu
      DEBFULLNAME: Denis Arnst
      SIGN_KEY: 893E9C96C0E1A0CE52CF88FD12C8E71EC92CF077
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts debhelper dput

      - name: Import GPG signing subkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # As in release.yml: the secret holds only the signing SUBKEY plus a
          # primary-key stub, so agent passphrase presets aimed at the primary
          # keygrip do not work. Plain import, and sign via loopback below.
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-subkey-fingerprints

      - name: Build and sign source package
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          version="${TAG}"
          pkgdir="${RUNNER_TEMP}/pkg"
          mkdir -p "${pkgdir}"
          # Pristine upstream tarball. .gitattributes keeps the packaging files
          # (debian/, headsetcontrol.spec) out of it, so the checkout is NOT the
          # same tree - build from the tarball and lay debian/ on top, or
          # dpkg-source rejects the extra files as upstream changes.
          git archive --format=tar.gz --prefix="headsetcontrol-${version}/" \
            -o "${pkgdir}/headsetcontrol_${version}.orig.tar.gz" "${TAG}"
          tar -xzf "${pkgdir}/headsetcontrol_${version}.orig.tar.gz" -C "${pkgdir}"
          cp -a debian "${pkgdir}/headsetcontrol-${version}/"
          cd "${pkgdir}/headsetcontrol-${version}"
          # Per-series versioned changelog entry (e.g. 4.1.0-1~noble1)
          dch -b --newversion "${version}-1~${{ matrix.series }}1" \
              --distribution "${{ matrix.series }}" \
              "Automated PPA build of ${version} for ${{ matrix.series }}."
          # debsign runs gpg with no passphrase, so it tries to prompt on
          # /dev/tty, which the runner does not have. Give it a wrapper that
          # signs non-interactively.
          cat > "${RUNNER_TEMP}/gpg-loopback" <<'EOF'
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/gpg-loopback"
          # -d: skip the build-dependency check. This is a source-only build,
          # nothing is compiled here - Launchpad's builders resolve
          # Build-Depends themselves.
          debuild -S -sa -d -k"${SIGN_KEY}" -p"${RUNNER_TEMP}/gpg-loopback"

      - name: Upload to PPA
        run: dput ppa:sapd/headsetcontrol "${RUNNER_TEMP}"/pkg/headsetcontrol_*_source.changes
