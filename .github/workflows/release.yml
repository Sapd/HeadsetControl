name: Release

# Publishes a signed, versioned GitHub release when a semver tag (no "v"
# prefix, e.g. 4.0.0) is pushed. Reuses the shared build-artifacts workflow,
# GPG-signs every artifact with the dedicated CI signing subkey, and attaches
# a source tarball + binaries + detached .asc signatures.
#
# Requires two repository secrets:
#   GPG_PRIVATE_KEY - armored export of the dedicated signing SUBKEY
#   GPG_PASSPHRASE  - passphrase protecting that subkey
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release (e.g. 4.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Build/package all platforms at the tagged commit
  build:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: ./artifacts

      - name: Build source tarball from tag
        run: |
          git archive --format=tar.gz \
            --prefix="headsetcontrol-${TAG}/" \
            -o "artifacts/headsetcontrol-${TAG}.tar.gz" \
            "${TAG}"

      - name: Import GPG signing subkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Plain import (not crazy-max/import-gpg): we ship only the signing
          # SUBKEY with a primary-key stub, and import-gpg's passphrase preset
          # targets the absent primary keygrip and fails. A direct import +
          # loopback signing works with a subkey-only export.
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-subkey-fingerprints

      - name: Sign artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd artifacts
          # Versioned releases ship artifact + detached signature only (no .sha256)
          rm -f ./*.sha256
          shopt -s nullglob
          for f in *; do
            case "$f" in *.asc) continue;; esac
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user '893E9C96C0E1A0CE52CF88FD12C8E71EC92CF077!' \
              --armor --detach-sign "$f"
            gpg --verify "$f.asc" "$f"
          done
          echo "Signed artifacts:"; ls -1

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          artifacts: "artifacts/*"
          generateReleaseNotes: true
          makeLatest: true
          prerelease: false
          allowUpdates: true
          # Never overwrite an existing release body on re-run (protects
          # manually curated notes); notes are still generated for new tags.
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
